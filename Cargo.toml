[package]
name = "pg-snapshots"
version = "0.2.0"
edition = "2021"
description = "Native PostgreSQL backup manager"
build = "build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
